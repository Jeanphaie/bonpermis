  bonpermis:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - /opt/apps/bonpermis-src/site:/usr/share/nginx/html:ro
      - /opt/apps/bonpermis-src/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # Site : bonpermis.fr
      - "traefik.http.routers.bonpermis.rule=Host(`bonpermis.fr`)"
      - "traefik.http.routers.bonpermis.entrypoints=websecure"
      - "traefik.http.routers.bonpermis.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bonpermis.middlewares=security-headers@file"
      - "traefik.http.routers.bonpermis.service=bonpermis"
      # Redirections permanentes (301) vers bonpermis.fr, même chemin : www et ancien domaine
      - "traefik.http.routers.bonpermis-redirections.rule=Host(`www.bonpermis.fr`) || Host(`ouipermis.fr`) || Host(`www.ouipermis.fr`)"
      - "traefik.http.routers.bonpermis-redirections.entrypoints=websecure"
      - "traefik.http.routers.bonpermis-redirections.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bonpermis-redirections.middlewares=vers-bonpermis"
      - "traefik.http.routers.bonpermis-redirections.service=bonpermis"
      - "traefik.http.middlewares.vers-bonpermis.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.vers-bonpermis.redirectregex.replacement=https://bonpermis.fr/$${1}"
      - "traefik.http.middlewares.vers-bonpermis.redirectregex.permanent=true"
      - "traefik.http.services.bonpermis.loadbalancer.server.port=80"
    networks:
      - web

