  ouipermis:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - /opt/apps/ouipermis-src/site:/usr/share/nginx/html:ro
      - /opt/apps/ouipermis-src/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ouipermis.rule=Host(`ouipermis.fr`) || Host(`www.ouipermis.fr`)"
      - "traefik.http.routers.ouipermis.entrypoints=websecure"
      - "traefik.http.routers.ouipermis.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ouipermis.middlewares=security-headers@file"
      - "traefik.http.services.ouipermis.loadbalancer.server.port=80"
    networks:
      - web

