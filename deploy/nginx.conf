server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Les illustrations changent rarement : cache navigateur 30 jours.
    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Pages des comptes (connexion, espace client, équipe, commande) : politique de sécurité stricte.
    # Scripts et requêtes uniquement depuis bonpermis.fr, page impossible à intégrer dans un autre site (anti-clickjacking).
    location ~ ^/(espace|admin|commande|dossier)/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }

    # La page elle-même : toujours revalidée, pour qu'un git pull se voie tout de suite.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
